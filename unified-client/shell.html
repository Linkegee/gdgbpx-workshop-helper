<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'"><title>学院统一客户端</title><link rel="stylesheet" href="shell.css"><header><strong>学院统一客户端</strong><span>v0.1.3 测试版 · 登录分区独立保存</span><button id="reminders">Bark 提醒</button></header><aside><button id="add">＋ 添加账号</button><p>在各账号首页手动登录，再从专题助手开始。切换账号不会关闭正在播放的页面。</p><div id="accounts"></div></aside><main>点击“添加账号”开始。<br>账号密码由学院登录页接收，面板不保存密码。</main><dialog id="bark"><form id="bark-form"><h3>Bark 异常提醒</h3><p>保存后，登录失效、启动失败和页面异常会向你的 Bark 设备发送通知。密钥只在本机加密保存。</p><label>Device key <input id="bark-key" type="password" autocomplete="off"></label><label>无进度提醒（分钟） <input id="bark-minutes" type="number" min="3" max="120" value="10"></label><p id="bark-status"></p><button type="submit">保存</button><button type="button" id="bark-disable">关闭提醒</button><button type="button" id="bark-cancel">取消</button></form></dialog><script src="shell.js"></script></html>
