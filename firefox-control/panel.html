<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>学院 · 账号面板</title><link rel="stylesheet" href="panel.css"></head>
<body><main><header><div class="eyebrow">广东干部学院 · 本地测试版 0.1.0</div><h1>账号面板</h1><p>一个账号对应一个独立容器。在这里准备登录、填写验证码，并检查结果。</p></header>
<section class="toolbar"><button id="prepare-all">全部准备登录</button><button id="submit-all">提交已填验证码的账号</button><button id="inspect-all" class="secondary">检查全部状态</button><button id="export" class="secondary">下载面板诊断</button></section>
<p id="notice" role="status" aria-live="polite">密码仅保留在本页输入框，提交后清空。按你的设置，平台使用协议默认勾选，提交登录时同步到学院页面。</p>
<form id="add-form"><h2>添加账号</h2><div class="add-fields"><label>账号 / 手机号<input id="username" required maxlength="100" autocomplete="off"></label><label>备注（可选）<input id="label" maxlength="80" placeholder="用于区分账号"></label><label>容器<select id="container"><option value="">自动创建独立容器</option></select></label><button type="submit">添加</button></div></form>
<section id="accounts" aria-label="账号列表"></section><p id="empty">还没有添加账号。已有容器也可以在上方绑定。</p>
<footer>登录测试版：学习开始/暂停、已完成学时汇总尚未接入。登录结果中的姓名与学时以学院当前页面为准，未读取到的数据显示“待读取”。</footer>
</main><template id="row-template"><article class="account"><div class="account-heading"><h2 class="title"></h2><span class="container-name"></span></div><div class="metrics"><div>首页已计入学时<strong class="hours">待读取</strong></div><div>已完成学时<strong>待接入</strong></div></div><p class="status" role="status">尚未准备登录</p><p class="identity"></p><div class="login-fields"><label>本次登录密码<input class="password" type="password" autocomplete="off" maxlength="512"></label><label>图片验证码<div class="captcha-line"><img class="captcha" alt="本账号登录验证码" hidden><input class="code" autocomplete="off" maxlength="20" placeholder="手动填写"></div></label></div><label class="agreement-label"><input class="agree" type="checkbox" checked> 我已阅读并同意学院平台使用协议（提交时同步勾选）</label><div class="actions"><button data-action="prepare">准备登录</button><button data-action="submit">提交登录</button><button data-action="inspect" class="secondary">检查状态</button><button data-action="refresh" class="secondary">换验证码</button><button data-action="focus" class="secondary">打开学院页</button><button data-action="remove" class="secondary">移出面板</button></div></article></template>
<script src="panel.js"></script></body></html>
